name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  legacy-boundary:
    name: Prevent active code from using old/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-no-legacy-references.mjs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @weda/frontend lint

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Component 1 contract datasets
        run: >-
          git -C ../.. lfs pull
          --include="ml/components/component1/data/raw/SL_Provider_Dataset_10000_Research_Grade.json,ml/components/component1/data/raw/SL_User_Request_Dataset_20000.csv,ml/components/component1/data/raw/SL_User_Interaction_Dataset_100000.csv"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
